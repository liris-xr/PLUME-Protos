syntax = "proto3";

package plume.sample.unity.ui;
option csharp_namespace = "PLUME.Sample.Unity.UI";

import "plume/sample/unity/identifiers.proto";

message ToggleCreate {
    ComponentIdentifier component = 1;
}

message ToggleDestroy {
    ComponentIdentifier component = 1;
}


message ToggleUpdate {
    ComponentIdentifier component = 1;
    optional bool is_on = 2;
    // ToggleGroup component, absent when the toggle is not grouped
    optional ComponentIdentifier group = 3;
}
