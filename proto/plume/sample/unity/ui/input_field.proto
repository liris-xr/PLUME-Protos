syntax = "proto3";

package plume.sample.unity.ui;
option csharp_namespace = "PLUME.Sample.Unity.UI";

import "plume/sample/unity/identifiers.proto";

// Shared by UnityEngine.UI.InputField and TMPro.TMP_InputField

message InputFieldCreate {
    ComponentIdentifier component = 1;
}

message InputFieldDestroy {
    ComponentIdentifier component = 1;
}


message InputFieldUpdate {
    ComponentIdentifier component = 1;
    optional string text = 2;
    optional bool is_focused = 3;
}

// Emitted when the field's onEndEdit event is invoked
message InputFieldEndEdit {
    ComponentIdentifier component = 1;
    string text = 2;
}
