syntax = "proto3";

package plume.sample.unity.ui;
option csharp_namespace = "PLUME.Sample.Unity.UI";

import "plume/sample/unity/identifiers.proto";

message SliderCreate {
    ComponentIdentifier component = 1;
}

message SliderDestroy {
    ComponentIdentifier component = 1;
}


message SliderUpdate {
    ComponentIdentifier component = 1;
    optional float value = 2;
    optional float min_value = 3;
    optional float max_value = 4;
    optional bool whole_numbers = 5;
    optional SliderDirection direction = 6;
}

enum SliderDirection {
    SLIDER_DIRECTION_LEFT_TO_RIGHT = 0;
    SLIDER_DIRECTION_RIGHT_TO_LEFT = 1;
    SLIDER_DIRECTION_BOTTOM_TO_TOP = 2;
    SLIDER_DIRECTION_TOP_TO_BOTTOM = 3;
}
