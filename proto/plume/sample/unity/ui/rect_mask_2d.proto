syntax = "proto3";

package plume.sample.unity.ui;
option csharp_namespace = "PLUME.Sample.Unity.UI";

import "plume/sample/unity/identifiers.proto";
import "plume/sample/common/vector4.proto";
import "plume/sample/common/vector2.proto";

message RectMask2DCreate {
    ComponentIdentifier component = 1;
}

message RectMask2DDestroy {
    ComponentIdentifier component = 1;
}


message RectMask2DUpdate {
    ComponentIdentifier component = 1;
    optional bool enabled = 2;
    // left, bottom, right, top
    optional common.Vector4 padding = 3;
    // Vector2Int stored as floats
    optional common.Vector2 softness = 4;
}
